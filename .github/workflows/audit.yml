name: audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "vendor/glib-0.18.5-patched/**"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "vendor/glib-0.18.5-patched/**"
      - ".github/workflows/audit.yml"
  schedule:
    # Daily: the advisory database is deliberately fetched live each run, so
    # newly published RustSec advisories flag here without any code change.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    # Write scopes are job-scoped, not workflow-level (Scorecard
    # Token-Permissions; OSTIF audit T-20): audit-check writes check runs on
    # PRs, and scheduled runs file findings as GitHub issues — without
    # issues:write it fails with "Resource not accessible by integration".
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Accepted transitive advisories, each with a concrete removal gate:
          # - GTK3 + proc-macro-error are required by Tauri 2 on Linux; remove
          #   their exceptions when Tauri 3 moves the stack to GTK4.
          # - rust-unic reaches us through Tauri's urlpattern 0.3 pin; remove
          #   those exceptions when Tauri adopts urlpattern 0.6+ (ICU-based).
          # - glib 0.18.5 is patched in-tree for RUSTSEC-2024-0429; cargo-audit
          #   matches versions only, so remove this exception with that patch.
          # - proc-macro-error2 reaches the lockfile only through an optional
          #   gix -> jiff -> defmt feature we never compile; remove upstream.
          # - RUSTSEC-2024-0413 (atk) is the same GTK3-unmaintained family as
          #   0411/0412/0414-0420; it was missing from this list (invisible
          #   because unmaintained advisories only warn) until Scorecard's OSV
          #   check counted it — OSTIF audit G-035. Same GTK4 removal gate.
          # - heapless 0.8 (RUSTSEC-2026-0574..0582) reaches us only through
          #   faster-hex 0.10 (via gix-hash and gix-packetline), which imports
          #   heapless solely under cfg(not(feature = "alloc")); both enable
          #   faster-hex/std, so no heapless code runs. Remove when heapless 0.8
          #   leaves Cargo.lock.
          # - chrono (RUSTSEC-2026-0543, unmaintained, no vulnerability) is in
          #   the lockfile only as serde_with's optional chrono_0_4 dependency
          #   (via tauri-utils) and is never compiled; remove when it leaves
          #   Cargo.lock.
          ignore: RUSTSEC-2024-0416,RUSTSEC-2024-0412,RUSTSEC-2024-0413,RUSTSEC-2024-0418,RUSTSEC-2024-0411,RUSTSEC-2024-0417,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0420,RUSTSEC-2024-0419,RUSTSEC-2024-0370,RUSTSEC-2025-0081,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0100,RUSTSEC-2025-0098,RUSTSEC-2024-0429,RUSTSEC-2026-0173,RUSTSEC-2026-0574,RUSTSEC-2026-0575,RUSTSEC-2026-0576,RUSTSEC-2026-0577,RUSTSEC-2026-0578,RUSTSEC-2026-0579,RUSTSEC-2026-0580,RUSTSEC-2026-0581,RUSTSEC-2026-0582,RUSTSEC-2026-0543
