[package]
name = "scl-forge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "sc-forge: a Gitea-compatible Git forge (unix only)"

[lib]
name = "scl_forge"
path = "src/lib.rs"

[[bin]]
name = "sc-forge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
scl-crypto = { path = "../crypto" }

# The whole implementation is unix-only (src/lib.rs is #![cfg(unix)]); keeping
# these out of other targets stops the Windows workspace check from compiling
# bundled SQLite for an empty crate.
[target.'cfg(unix)'.dependencies]
flate2 = "1.1.10"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde_json = "1.0.154"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "signal", "time", "macros", "sync"] }
url = "2.5.8"

[lints]
workspace = true
