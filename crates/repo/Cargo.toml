[package]
name = "scl-repo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
scl-core = { path = "../core" }
scl-vfs = { path = "../vfs" }
scl-crypto = { path = "../crypto" }
thiserror = "2.0.18"
regex = "1"
toml = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2.186"
scl-tlsio = { version = "0.1.0", path = "../tlsio" }
scl-objio = { version = "0.1.0", path = "../objio" }
hex = "0.4.3"
blake3 = "1.8.5"

# Owner-only DACL for .sc/local-key (#214); the only unsafe is in src/winacl.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints]
workspace = true
