[package]
name = "scl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.5"
thiserror = "2.0.18"
hex = "0.4.3"
zstd = "0.14.0"

# Owner-only DACL for secret files (#214, #281); the only unsafe is in src/winacl.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
